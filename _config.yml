# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Desiderantes.com
url: http://desiderantes.com
email: desiderantes93@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  A blog about software and other stuff. Not much to be honest.
twitter_username: desiderantes
github_username: desiderantes
minimal_mistakes_skin: default
search: true
repo: http://github.com/desiderantes/desiderantes.github.io

comments:
  provider: "disqus"
  disqus:
    shortname: "desiderantes"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:year/:month/:day/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: CO
include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: Mario Daniel Ruiz Saavedra
  job: Software Developer
  username: desiderantes
  avatar : "/assets/images/author.jpg"
  bio    : "Colombian software developer, free software guy."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://desiderantes.com/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/desiderantes"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/desiderantes"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/desiderantes"
    - label: "Paypal"
      icon: "fab fa-fw fa-paypal"
      url: "https://paypal.me/desiderantes"

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/desiderantes"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/desiderantes"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/desiderantes"
    - label: "Keybase"
      icon: "fab fa-fw fa-keybase"
      url: "https://keybase.io/desiderantes"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

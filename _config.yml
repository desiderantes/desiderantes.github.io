# Build settings
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-octicons
  - jekyll-github-metadata
  - jemoji
  - jekyll-paginate
  - bourbon

paginate: 5
paginate_path: "/blog/page/:num/"

#pagination:
#  enabled: true
#  per_page: 10
#  permalink:
#  sort_field: "date"
#  sort_reversed: true

comments: true

destination: _site
sass:
  sass_dir: _sass
  style: compressed # expanded

# SEO settings
title: Desiderantes.com
description: "Personal website of @desiderantes"
keywords: "vala, gtk, free software, kotlin, java, backend, web"
url: http://desiderantes.com
baseurl: ""

google_analytics: UA-140395998-1
repo: http://github.com/desiderantes/desiderantes.github.io
disqus_shortname: "desiderantes"
disqus_site_shortname: "desiderantes"

# Author settings
author:
  name: Mario Daniel Ruiz Saavedra
  job: Software Developer
  username: desiderantes
  bio: "Free software supporter, dog person, elementaryOS user"
  thumb: /images/author.jpg
  email: desiderantes93@gmail.com
  url: https://desiderantes.com/
  github: https://github.com/desiderantes
  twitter: https://twitter.com/desiderantes
  facebook: https://facebook.com/desiderantes
  keybase: https://keybase.io/desiderantes
  linkedin: https://linkedin.com/in/desiderantes
  paypal: https://paypal.me/desiderantes

projects:
  sort_by: stars
  # sort_by options:
  #   - pushed
  #   - stars
  limit: 10
  exclude:
    archived: true
    forks: true
    projects:

# navbar pages
navbar:
  - slug: about
    title: About
  - slug: blog
    title: Blog
  - slug: projects
    title: Projects

misc:
  dog: /images/dog.jpg
  palm_trees: /images/palm_trees.jpg

exclude: ["config.rb", "src", "Gemfile", "Gemfile.lock", "package.json","README.md", "Rakefile"]
